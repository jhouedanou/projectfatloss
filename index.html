    <!-- Script pour gérer les chemins base en production -->
    <script>
      // Déterminer la base URL pour les ressources statiques
      (function() {
        window.BASE_URL = '';
        // Vérifier si nous sommes en production sur GitHub Pages
        if (window.location.hostname !== 'localhost' && !window.location.hostname.includes('127.0.0.1')) {
          // Extraire le chemin de base depuis l'URL actuelle (ex: /projectfatloss/)
          const pathArray = window.location.pathname.split('/');
          if (pathArray.length > 1) {
            window.BASE_URL = '/' + pathArray[1]; // ex: /projectfatloss
          }
          console.log('Base URL détectée:', window.BASE_URL);
        }
      })();
    </script>
    <script>
      // Thème appliqué AVANT le premier rendu pour éviter le flash clair/sombre.
      // Même clé que React ('theme') ; sombre par défaut.
      (function () {
        try {
          if (localStorage.getItem('theme') !== 'light') {
            document.documentElement.classList.add('dark-theme');
            document.addEventListener('DOMContentLoaded', function () {
              document.body.classList.add('dark-theme');
            });
          }
        } catch (e) { /* stockage indisponible : thème sombre via React */ }
      })();
    </script>
    <script>
      // Filet de sécurité : une erreur JS avant le rendu React laisse un écran
      // blanc muet dans la WebView Android. Afficher l'erreur à l'écran pour
      // pouvoir diagnostiquer sans chrome://inspect.
      (function () {
        function show(message) {
          try {
            var root = document.getElementById('root');
            if (root && root.children.length > 0) return; // l'app a rendu : erreur non fatale
            var box = document.getElementById('pfl-boot-error');
            if (!box) {
              box = document.createElement('div');
              box.id = 'pfl-boot-error';
              box.style.cssText = 'position:fixed;inset:12px auto auto 12px;right:12px;z-index:99999;' +
                'background:#7a1306;color:#fff;padding:12px 14px;border-radius:10px;' +
                'font:13px/1.5 monospace;white-space:pre-wrap;word-break:break-word;';
              box.textContent = 'Erreur au démarrage :\n';
              (document.body || document.documentElement).appendChild(box);
            }
            box.textContent += '\n' + message;
          } catch (e) { /* jamais bloquer le boot pour l'overlay */ }
        }
        window.addEventListener('error', function (e) {
          show((e.message || 'Erreur script') + (e.filename ? '\n' + e.filename + ':' + e.lineno : ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          show('Promise rejetée : ' + (r && (r.message || r.toString ? r.toString() : String(r))));
        });
      })();
    </script>

    <script src="https://cdn.onesignal.com/sdks/OneSignalSDK.js" async=""></script>
    <script>
      // Déterminer si nous sommes en développement local
      const isLocalhost = window.location.hostname === 'localhost' || 
                         window.location.hostname === '127.0.0.1' ||
                         window.location.hostname === '';
      
      if (!isLocalhost) {
        // Initialiser OneSignal uniquement en production
        window.OneSignal = window.OneSignal || [];
        OneSignal.push(function() {
          OneSignal.init({
            appId: "4b3067b6-a9db-4e53-9e9a-2be01ed43805",
            safari_web_id: "web.onesignal.auto.4f2f8c0c-7b89-4f8e-a2c7-3c73c2c652ac",
            notifyButton: {
              enable: false,
            }
          });
          console.log('OneSignal: Configuration production activée');
        });
      } else {
        // En développement local, créer un stub OneSignal compatible
        window.OneSignal = window.OneSignal || [];
        
        // Ajouter les méthodes nécessaires comme stub
        if (!window.OneSignal.Notifications) {
          window.OneSignal.Notifications = {
            permission: 'default',
            requestPermission: function() {
              console.log('OneSignal: Stub - requestPermission appelé');
              return Promise.resolve();
            }
          };
        }
        
        // S'assurer que push fonctionne comme un vrai tableau
        if (typeof window.OneSignal.push !== 'function') {
          window.OneSignal.push = function(callback) {
            console.log('OneSignal: Stub - push appelé, callback ignoré en développement');
            // Ne pas exécuter le callback en développement pour éviter les erreurs
          };
        }
        
        console.log('OneSignal: Mode développement local - stub compatible activé');
      }
    </script>

  <body>
    <div id="root">
      <!-- Écran de démarrage : remplacé par React au montage. Sert aussi de
           sentinelle au watchdog anti-page-blanche ci-dessous (#pfl-boot). -->
      <div id="pfl-boot" aria-label="Chargement de l'application" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#22223b;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;">
        <div style="width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.25);border-top-color:#F03D32;animation:pfl-spin 1s linear infinite;"></div>
        <p style="margin:0;font-size:14px;opacity:.75;">Chargement…</p>
      </div>
    </div>
    <style>@keyframes pfl-spin{to{transform:rotate(360deg)}}</style>
    <script type="module" src="./src/main.jsx"></script>
    <script>
      /*
       * Watchdog anti-« page blanche ».
       * Si React ne se monte jamais (bundle en cache corrompu, asset 404 après
       * un redéploiement, erreur JS au chargement…), l'écran #pfl-boot reste
       * affiché. On tente alors UNE récupération automatique : désinscription
       * des service workers + purge du Cache Storage (JAMAIS le localStorage,
       * pour préserver les données d'entraînement), puis un rechargement.
       * Un drapeau en sessionStorage empêche toute boucle de rechargement.
       */
      (function () {
        var BOOT_ID = 'pfl-boot';
        var FLAG = 'pfl_recovery_reloaded';
        var TIMEOUT_MS = 10000;

        function appMounted() {
          // React a remplacé le contenu de #root : l'écran de démarrage a disparu.
          return !document.getElementById(BOOT_ID);
        }

        function purgeCachesAndSW() {
          var jobs = [];
          try {
            if ('serviceWorker' in navigator) {
              jobs.push(
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                  return Promise.all(regs.map(function (r) { return r.unregister(); }));
                }).catch(function () {})
              );
            }
          } catch (e) {}
          try {
            if (window.caches && caches.keys) {
              jobs.push(
                caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                }).catch(function () {})
              );
            }
          } catch (e) {}
          return Promise.all(jobs);
        }

        function showRecoveryUI() {
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML =
            '<div style="position:fixed;inset:0;display:flex;flex-direction:column;' +
            'align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;' +
            'background:#22223b;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;">' +
            '<h2 style="margin:0;font-size:20px;">Impossible de charger l\'application</h2>' +
            '<p style="margin:0;max-width:340px;font-size:14px;line-height:1.5;opacity:.8;">' +
            'Une version en cache semble corrompue. Videz le cache puis rechargez.</p>' +
            '<button id="pfl-recover-btn" style="padding:12px 22px;font-size:15px;border:none;' +
            'border-radius:8px;background:#F03D32;color:#fff;cursor:pointer;">Vider le cache et recharger</button>' +
            '</div>';
          var btn = document.getElementById('pfl-recover-btn');
          if (btn) {
            btn.addEventListener('click', function () {
              purgeCachesAndSW().then(function () { window.location.reload(); });
            });
          }
        }

        window.setTimeout(function () {
          if (appMounted()) {
            // Montage réussi : on efface tout drapeau de récupération résiduel.
            try { sessionStorage.removeItem(FLAG); } catch (e) {}
            return;
          }

          var alreadyTried = false;
          try { alreadyTried = sessionStorage.getItem(FLAG) === '1'; } catch (e) {}

          if (alreadyTried) {
            // La récupération auto n'a pas suffi : on évite la boucle et on
            // propose une action manuelle plutôt qu'un écran blanc.
            showRecoveryUI();
            return;
          }

          try { sessionStorage.setItem(FLAG, '1'); } catch (e) {}
          console.warn('[watchdog] Application non montée après ' + TIMEOUT_MS +
            'ms — purge du cache + rechargement.');
          purgeCachesAndSW().then(function () { window.location.reload(); });
        }, TIMEOUT_MS);
      })();
    </script>
