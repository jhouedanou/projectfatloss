plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jhouedanou.projectfatloss.wear'
    compileSdk 34

    defaultConfig {
        applicationId 'com.jhouedanou.projectfatloss.wear'
        minSdk 30
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Aucune dépendance externe : WebView + capteurs du framework Android uniquement.
}
